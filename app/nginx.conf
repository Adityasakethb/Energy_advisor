server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    absolute_redirect off;
    port_in_redirect off;

    # Exact match for /echowatt redirect to /echowatt/
    location = /echowatt {
        return 301 /echowatt/;
    }

    # Serve application at /echowatt/ with SPA routing fallback
    location /echowatt/ {
        try_files $uri $uri/ /echowatt/index.html;
    }

    # Redirect root / to /echowatt/
    location = / {
        return 301 /echowatt/;
    }
}

