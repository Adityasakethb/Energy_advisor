# ==============================================================================
# Host Nginx Reverse Proxy Configuration (Port 80/443 Routing)
# Place or include this configuration within your Host Reverse Proxy setup.
# ==============================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream echowatt_frontend {
    # If Host Nginx runs on the host machine directly (native Windows):
    # server 127.0.0.1:8104;

    # If Host Nginx runs via Docker on host:
    # server host.docker.internal:8104;

    # If Host Nginx runs in shared Docker network (e.g. app_default):
    server echowatt-app:8104;
}

server {
    listen 80;
    server_name localhost;

    # Clean URL handling for /echowatt
    location = /echowatt {
        return 301 /echowatt/;
    }

    # Proxy to EchoWatt Frontend
    location /echowatt/ {
        proxy_pass http://echowatt_frontend/echowatt/;
        proxy_http_version 1.1;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # Optional root redirect to default service
    location = / {
        return 301 /echowatt/;
    }
}
