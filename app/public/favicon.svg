<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0b132c"/>
      <stop offset="100%" stopColor="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#38bdf8"/>
      <stop offset="50%" stopColor="#2563eb"/>
      <stop offset="100%" stopColor="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#ffffff"/>
      <stop offset="100%" stopColor="#93c5fd"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded box -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Outer glowing energy leaf contour -->
  <path d="M32 8 C46 16 52 30 46 44 C41 54 28 56 20 48 C14 42 14 32 20 22 C24 16 28 11 32 8 Z" 
        fill="url(#leafGrad)" 
        opacity="0.95" 
        filter="url(#glow)"/>

  <!-- Inner accent swoosh -->
  <path d="M32 14 C40 22 42 34 36 44 C32 49 24 50 21 44 C27 45 33 39 33 31 C33 24 30 19 32 14 Z" 
        fill="#ffffff" 
        opacity="0.9"/>

  <!-- Electric Energy Bolt in pure white & light cyan -->
  <polygon points="34,18 25,33 32,33 28,47 41,31 33,31" 
           fill="url(#glowGrad)" 
           stroke="#ffffff" 
           stroke-width="0.8" 
           stroke-linejoin="round"/>
</svg>